<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>My complaints — CampusCare</title><script>
  const KEY = 'campuscare:v1';
  const seed = [{"id":"CC-1048","title":"Wi-Fi not working in Lab 3","description":"The connection keeps dropping during class.","category":"IT","location":"Computer Lab 3","status":"In Progress","department":"IT Department","student":"Tasnim Turin","createdAt":"2026-11-01","updatedAt":"2026-11-01"},{"id":"CC-1039","title":"Broken chair in Room 204","description":"One of the chairs is unsafe to use.","category":"Classroom","location":"Room 204","status":"Resolved","department":"Facilities","student":"Tasnim Turin","createdAt":"2026-10-28","updatedAt":"2026-10-30","feedback":{"rating":5,"comment":"Thank you for the quick fix."}},{"id":"CC-1027","title":"Bus arriving late on Route B","description":"The bus has arrived late several times this week.","category":"Transport","location":"Main gate","status":"Submitted","department":"Transport","student":"Tasnim Turin","createdAt":"2026-10-25","updatedAt":"2026-10-25"}];
  function getState(){ const raw=localStorage.getItem(KEY); if(raw){ const state=JSON.parse(raw); state.users=(state.users||[]).map(u=>({...u,password:u.password||'password'})); return state; } const state={user:null,users:[{name:'Tasnim Turin',id:'R-22',email:'tasnim@example.com',role:'student',password:'password'},{name:'Prima Rahman',id:'R-23',email:'prima@example.com',role:'staff',password:'password'},{name:'Fahim Ahmed',id:'R-24',email:'fahim@example.com',role:'admin',password:'password'}],complaints:seed,notifications:[{id:1,text:'Your complaint was assigned to the IT Department.',read:false,time:'2h ago'}]}; localStorage.setItem(KEY,JSON.stringify(state)); return state; }
  function saveState(state){ localStorage.setItem(KEY,JSON.stringify(state)); return state; }
  function logout(){ const state=getState(); state.user=null; saveState(state); location.href='/login'; }
  function escapeHtml(value){ return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c])); }
  window.CampusCare={getState,saveState,escapeHtml,logout,seed};
</script><script>const publicRoutes=['/login','/register'];const state=CampusCare.getState();if(!publicRoutes.includes(location.pathname)&&(!state.user||!state.users.some(u=>u.id===state.user.id&&u.email===state.user.email))){state.user=null;CampusCare.saveState(state);location.replace('/login')}</script><link rel="stylesheet" href="/_astro/store.HN61tvXP.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">✦</span><span>Campus<span>Care</span></span></a><div class="workspace-label">STUDENT PORTAL</div><nav aria-label="Main navigation"><a class="nav-item " href="/"><span>⌂</span> Overview</a><a class="nav-item active" href="/complaints"><span>▤</span> My complaints <b data-complaint-count>0</b></a><a class="nav-item " href="/report"><span>＋</span> New complaint</a><a class="nav-item " href="/notifications"><span>♧</span> Notifications</a></nav><div class="sidebar-bottom"><a class="nav-item " href="/help"><span>?</span> Help & support</a><div class="account-card"><div class="account-identity"><div class="avatar" data-user-avatar></div><div class="account-copy"><strong data-user-name></strong><small data-user-meta></small></div></div><div class="account-actions"><a class href="/profile">Profile</a><button type="button" data-sign-out>Sign out</button></div></div></div></aside><script>
  queueMicrotask(() => {
    const state = CampusCare.getState(), user = state.user;
    if (!user) return;
    const sidebar = document.querySelector('.sidebar');
    sidebar.querySelector('[data-user-name]').textContent = user.name;
    sidebar.querySelector('[data-user-meta]').textContent = `${user.role} · ${user.id}`;
    sidebar.querySelector('[data-user-avatar]').textContent = user.name.trim().split(/\s+/).map(part => part[0]).slice(0, 2).join('').toUpperCase();
    sidebar.querySelector('[data-complaint-count]').textContent = state.complaints.filter(c => user.role !== 'student' || c.student === user.name).length;
    sidebar.querySelector('[data-sign-out]').addEventListener('click', () => CampusCare.logout());
  });
</script><main class="main-content"><header class="topbar"><div class="breadcrumb"><span>Student portal</span><b>/</b> My complaints</div><div class="top-actions"><a class="primary-button" href="/report">＋ New complaint</a><div class="top-avatar" data-top-avatar></div></div></header><section class="page-content"><div class="welcome-row"><div><p class="eyebrow">YOUR REPORTS</p><h1>My complaints</h1><p class="subtitle">Follow every issue from submission to resolution.</p></div></div><div class="filter-bar"><button class="filter active" data-filter="All">All <b id="all-count">0</b></button><button class="filter" data-filter="Submitted">Submitted</button><button class="filter" data-filter="In Progress">In progress</button><button class="filter" data-filter="Resolved">Resolved</button></div><div class="complaints-card" id="complaints-list"></div><section class="notice-card notifications-panel" id="notifications"><div class="notice-head"><h2>Notifications</h2><a href="/notifications">Manage notifications →</a></div><div id="notification-list"></div></section></section></main></div><script>const list=document.querySelector('#complaints-list'),state=CampusCare.getState(),visible=state.complaints.filter(c=>state.user.role!=='student'||c.student===state.user.name);document.querySelector('#all-count').textContent=visible.length;document.querySelector('[data-top-avatar]').textContent=state.user.name.split(/\s+/).map(s=>s[0]).slice(0,2).join('').toUpperCase();function render(filter='All'){const items=visible.filter(c=>filter==='All'||c.status===filter);list.innerHTML=items.map(c=>`<a class="complaint-link" href="/complaint?id=${encodeURIComponent(c.id)}"><div class="table-row"><div class="complaint-name"><div class="complaint-icon">▤</div><div><strong>${CampusCare.escapeHtml(c.title)}</strong><small>${CampusCare.escapeHtml(c.id)} · ${CampusCare.escapeHtml(c.location)}</small></div></div><span class="category">${CampusCare.escapeHtml(c.category)}</span><span class="status ${c.status.toLowerCase().replace(' ','-')}"><i></i>${CampusCare.escapeHtml(c.status)}</span><span class="date">${CampusCare.escapeHtml(c.createdAt)}</span><span>→</span></div></a>`).join('')||'<div class="empty-state">No complaints in this view.</div>'}render();document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});document.querySelector('#notification-list').innerHTML=state.notifications.map(n=>`<div class="notification-row"><div class="notice-dot">${n.read?'✓':'●'}</div><div><strong>${CampusCare.escapeHtml(n.text)}</strong><small>${CampusCare.escapeHtml(n.time)}</small></div></div>`).join('')||'<div class="empty-state">You are all caught up.</div>';</script></body></html>
