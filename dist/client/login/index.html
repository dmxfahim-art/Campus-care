<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Sign in — CampusCare</title><script>
  const KEY = 'campuscare:v1';
  const seed = [{"id":"CC-1048","title":"Wi-Fi not working in Lab 3","description":"The connection keeps dropping during class.","category":"IT","location":"Computer Lab 3","status":"In Progress","department":"IT Department","student":"Tasnim Turin","createdAt":"2026-11-01","updatedAt":"2026-11-01"},{"id":"CC-1039","title":"Broken chair in Room 204","description":"One of the chairs is unsafe to use.","category":"Classroom","location":"Room 204","status":"Resolved","department":"Facilities","student":"Tasnim Turin","createdAt":"2026-10-28","updatedAt":"2026-10-30","feedback":{"rating":5,"comment":"Thank you for the quick fix."}},{"id":"CC-1027","title":"Bus arriving late on Route B","description":"The bus has arrived late several times this week.","category":"Transport","location":"Main gate","status":"Submitted","department":"Transport","student":"Tasnim Turin","createdAt":"2026-10-25","updatedAt":"2026-10-25"}];
  function getState(){ const raw=localStorage.getItem(KEY); if(raw){ const state=JSON.parse(raw); state.users=(state.users||[]).map(u=>({...u,password:u.password||'password'})); return state; } const state={user:null,users:[{name:'Tasnim Turin',id:'R-22',email:'tasnim@example.com',role:'student',password:'password'},{name:'Prima Rahman',id:'R-23',email:'prima@example.com',role:'staff',password:'password'},{name:'Fahim Ahmed',id:'R-24',email:'fahim@example.com',role:'admin',password:'password'}],complaints:seed,notifications:[{id:1,text:'Your complaint was assigned to the IT Department.',read:false,time:'2h ago'}]}; localStorage.setItem(KEY,JSON.stringify(state)); return state; }
  function saveState(state){ localStorage.setItem(KEY,JSON.stringify(state)); return state; }
  function logout(){ const state=getState(); state.user=null; saveState(state); location.href='/login'; }
  function escapeHtml(value){ return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c])); }
  window.CampusCare={getState,saveState,escapeHtml,logout,seed};
</script><script>const publicRoutes=['/login','/register'];const state=CampusCare.getState();if(!publicRoutes.includes(location.pathname)&&(!state.user||!state.users.some(u=>u.id===state.user.id&&u.email===state.user.email))){state.user=null;CampusCare.saveState(state);location.replace('/login')}</script><link rel="stylesheet" href="/_astro/store.HN61tvXP.css"></head><body><main class="auth-page"><div class="auth-brand"><span class="brand-mark">✦</span> Campus<span>Care</span></div><section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Sign in to CampusCare</h1><p class="auth-subtitle">Track your complaints and stay connected to campus.</p><form id="login-form"><label>Email<input name="email" type="email" required value="tasnim@example.com"></label><label>Password<input name="password" type="password" required placeholder="Minimum 6 characters"></label><div class="form-error" id="error"></div><button class="primary-button" type="submit">Sign in →</button></form><p class="auth-footer">New to CampusCare? <a href="/register">Create an account</a></p></section></main><script>document.querySelector('#login-form').addEventListener('submit',e=>{e.preventDefault();const state=CampusCare.getState(),f=new FormData(e.currentTarget),email=String(f.get('email')).toLowerCase(),password=String(f.get('password')),user=state.users.find(u=>u.email.toLowerCase()===email&&u.password===password);if(!user){document.querySelector('#error').textContent='Incorrect email or password.';return}state.user=user;CampusCare.saveState(state);location.href='/'});</script></body></html>
