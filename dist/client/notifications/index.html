<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Notifications — CampusCare</title><script>
  const KEY = 'campuscare:v1';
  const seed = [{"id":"CC-1048","title":"Wi-Fi not working in Lab 3","description":"The connection keeps dropping during class.","category":"IT","location":"Computer Lab 3","status":"In Progress","department":"IT Department","student":"Tasnim Turin","createdAt":"2026-11-01","updatedAt":"2026-11-01"},{"id":"CC-1039","title":"Broken chair in Room 204","description":"One of the chairs is unsafe to use.","category":"Classroom","location":"Room 204","status":"Resolved","department":"Facilities","student":"Tasnim Turin","createdAt":"2026-10-28","updatedAt":"2026-10-30","feedback":{"rating":5,"comment":"Thank you for the quick fix."}},{"id":"CC-1027","title":"Bus arriving late on Route B","description":"The bus has arrived late several times this week.","category":"Transport","location":"Main gate","status":"Submitted","department":"Transport","student":"Tasnim Turin","createdAt":"2026-10-25","updatedAt":"2026-10-25"}];
  function getState(){ const raw=localStorage.getItem(KEY); if(raw){ const state=JSON.parse(raw); state.users=(state.users||[]).map(u=>({...u,password:u.password||'password'})); return state; } const state={user:null,users:[{name:'Tasnim Turin',id:'R-22',email:'tasnim@example.com',role:'student',password:'password'},{name:'Prima Rahman',id:'R-23',email:'prima@example.com',role:'staff',password:'password'},{name:'Fahim Ahmed',id:'R-24',email:'fahim@example.com',role:'admin',password:'password'}],complaints:seed,notifications:[{id:1,text:'Your complaint was assigned to the IT Department.',read:false,time:'2h ago'}]}; localStorage.setItem(KEY,JSON.stringify(state)); return state; }
  function saveState(state){ localStorage.setItem(KEY,JSON.stringify(state)); return state; }
  function logout(){ const state=getState(); state.user=null; saveState(state); location.href='/login'; }
  function escapeHtml(value){ return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c])); }
  window.CampusCare={getState,saveState,escapeHtml,logout,seed};
</script><script>const publicRoutes=['/login','/register'];const state=CampusCare.getState();if(!publicRoutes.includes(location.pathname)&&(!state.user||!state.users.some(u=>u.id===state.user.id&&u.email===state.user.email))){state.user=null;CampusCare.saveState(state);location.replace('/login')}</script><link rel="stylesheet" href="/_astro/store.HN61tvXP.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">✦</span><span>Campus<span>Care</span></span></a><div class="workspace-label">STUDENT PORTAL</div><nav aria-label="Main navigation"><a class="nav-item " href="/"><span>⌂</span> Overview</a><a class="nav-item " href="/complaints"><span>▤</span> My complaints <b data-complaint-count>0</b></a><a class="nav-item " href="/report"><span>＋</span> New complaint</a><a class="nav-item active" href="/notifications"><span>♧</span> Notifications</a></nav><div class="sidebar-bottom"><a class="nav-item " href="/help"><span>?</span> Help & support</a><div class="account-card"><div class="account-identity"><div class="avatar" data-user-avatar></div><div class="account-copy"><strong data-user-name></strong><small data-user-meta></small></div></div><div class="account-actions"><a class href="/profile">Profile</a><button type="button" data-sign-out>Sign out</button></div></div></div></aside><script>
  queueMicrotask(() => {
    const state = CampusCare.getState(), user = state.user;
    if (!user) return;
    const sidebar = document.querySelector('.sidebar');
    sidebar.querySelector('[data-user-name]').textContent = user.name;
    sidebar.querySelector('[data-user-meta]').textContent = `${user.role} · ${user.id}`;
    sidebar.querySelector('[data-user-avatar]').textContent = user.name.trim().split(/\s+/).map(part => part[0]).slice(0, 2).join('').toUpperCase();
    sidebar.querySelector('[data-complaint-count]').textContent = state.complaints.filter(c => user.role !== 'student' || c.student === user.name).length;
    sidebar.querySelector('[data-sign-out]').addEventListener('click', () => CampusCare.logout());
  });
</script><main class="main-content"><header class="topbar"><div class="breadcrumb"><span>Student portal</span><b>/</b> Notifications</div></header><section class="page-content form-page"><h1>Notifications</h1><button class="secondary-button" id="mark-all">Mark all as read</button><section class="notice-card notifications-panel" id="notification-list"></section></section></main></div><script>const state=CampusCare.getState(),list=document.querySelector('#notification-list');function render(){list.innerHTML=state.notifications.map(n=>`<div class="notification-row"><div class="notice-dot">${n.read?'✓':'●'}</div><div><strong>${CampusCare.escapeHtml(n.text)}</strong><small>${CampusCare.escapeHtml(n.time)} · ${n.read?'Read':'Unread'}</small></div><button class="secondary-button" data-id="${n.id}">${n.read?'Mark unread':'Mark read'}</button></div>`).join('')||'<div class="empty-state">No notifications yet.</div>';list.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const n=state.notifications.find(x=>String(x.id)===b.dataset.id);n.read=!n.read;CampusCare.saveState(state);render()})}document.querySelector('#mark-all').onclick=()=>{state.notifications.forEach(n=>n.read=true);CampusCare.saveState(state);render()};render();</script></body></html>
